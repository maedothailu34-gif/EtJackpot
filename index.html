
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ETHIO JACKPOT</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #081426;
      color: white;
      padding: 12px;
    }

    .app {
      max-width: 600px;
      margin: auto;
    }

    header {
      text-align: center;
      padding: 20px 0;
    }

    .logo {
      color: #f4c542;
      font-size: 29px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .subtitle {
      color: #aab6c8;
      margin-top: 8px;
    }

    .demo {
      background: #493a12;
      color: #ffdb70;
      padding: 10px;
      border-radius: 10px;
      text-align: center;
      font-size: 12px;
      margin-bottom: 15px;
    }

    .jackpots {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .card {
      background: #12233b;
      border: 1px solid #263b57;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .card h3 {
      font-size: 12px;
      color: #aab6c8;
      margin: 0 0 10px;
    }

    .amount {
      color: #f4c542;
      font-size: 21px;
      font-weight: bold;
    }

    .section-title {
      margin: 20px 0 12px;
      font-size: 19px;
    }

    .numbers {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 5px;
    }

    .number {
      width: 100%;
      min-width: 0;
      padding: 0;
      background: #192c46;
      color: white;
      border: 1px solid #344a66;
      border-radius: 6px;
      aspect-ratio: 1;
      font-size: clamp(10px, 3vw, 13px);
      cursor: pointer;
    }

    .number.selected {
      background: #f4c542;
      color: #081426;
      font-weight: bold;
      border-color: #f4c542;
    }

    .selected-display {
      color: #f4c542;
      font-weight: bold;
      min-height: 25px;
      margin: 10px 0;
    }

    .button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      background: #f4c542;
      color: #081426;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    .secondary {
      background: #263b57;
      color: white;
    }

    .notice {
      color: #aab6c8;
      font-size: 12px;
      text-align: center;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <main class="app">

    <header>
      <div class="logo">ETHIO JACKPOT</div>
      <div class="subtitle">Your Numbers. Your Chance.</div>
    </header>

    <div class="demo">
      DEMO VERSION — NO REAL MONEY
    </div>

    <div class="jackpots">
      <div class="card">
        <h3>FIRST PRIZE</h3>
        <div class="amount">ETB 2,000</div>
      </div>

      <div class="card">
        <h3>SECOND PRIZE</h3>
        <div class="amount">ETB 500</div>
      </div>
    </div>

    <h2 class="section-title">Choose Your Numbers</h2>

    <div class="card">
      <h3>Select exactly 4 different numbers (1–99)</h3>

      <div class="selected-display" id="selected">
        No numbers selected
      </div>

      <div class="numbers" id="numbers"></div>

      <p class="notice">Demo ticket price: ETB 20</p>

      <button class="button secondary" onclick="clearNumbers()">
        CLEAR SELECTION
      </button>

      <button class="button" onclick="confirmTicket()">
        CONFIRM DEMO TICKET
      </button>
    </div>

    <p class="notice">
      ETHIO JACKPOT · Prototype Version 1.0
    </p>

  </main>

  <script>
    let selectedNumbers = [];

    const grid = document.getElementById("numbers");

    for (let i = 1; i <= 99; i++) {
      const btn = document.createElement("button");

      btn.className = "number";
      btn.textContent = i;

      btn.onclick = function () {
        selectNumber(i, btn);
      };

      grid.appendChild(btn);
    }

    function selectNumber(number, button) {
      if (selectedNumbers.includes(number)) {
        selectedNumbers = selectedNumbers.filter(n => n !== number);
        button.classList.remove("selected");
      } else {
        if (selectedNumbers.length >= 4) {
          alert("You can select only 4 numbers.");
          return;
        }

        selectedNumbers.push(number);
        button.classList.add("selected");
      }

      updateSelection();
    }

    function updateSelection() {
      const display = document.getElementById("selected");

      display.textContent = selectedNumbers.length
        ? selectedNumbers.slice().sort((a,b) => a-b).join(" – ")
        : "No numbers selected";
    }

    function clearNumbers() {
      selectedNumbers = [];

      document.querySelectorAll(".number").forEach(btn => {
        btn.classList.remove("selected");
      });

      updateSelection();
    }

    function confirmTicket() {
      if (selectedNumbers.length !== 4) {
        alert("Please select exactly 4 numbers.");
        return;
      }

      const numbers = selectedNumbers.slice().sort((a,b) => a-b);

      if (confirm("Confirm your DEMO ticket?\n\nNumbers: " +
        numbers.join(" – ") + "\n\nPrice: ETB 20 (SIMULATED)")) {
        alert("Demo selection confirmed!\n\nNumbers: " +
          numbers.join(" – ") +
          "\n\nNo real payment has been made.");
      }
    }
  </script>
</body>
</html>
